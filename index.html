<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOLO STRIKER FOOTBALL</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #07110b;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .game {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* SCOREBOARD */
    .topbar {
      height: 70px;
      background: #111820;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 2px solid #26333d;
      z-index: 10;
    }

    .team {
      font-size: 15px;
      font-weight: bold;
    }

    .score {
      font-size: 28px;
      font-weight: 900;
    }

    .timer {
      color: #80ff9a;
      font-size: 14px;
      margin-top: 3px;
    }

    /* PITCH */
    .pitch-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
    }

    .pitch {
      position: relative;
      width: min(94vw, 900px);
      height: min(72vh, 600px);
      background:
        repeating-linear-gradient(
          90deg,
          #16863b 0px,
          #16863b 70px,
          #197f39 70px,
          #197f39 140px
        );
      border: 4px solid white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 255, 100, 0.18);
    }

    /* HALF WAY */
    .halfway {
      position: absolute;
      left: 50%;
      top: 0;
      height: 100%;
      width: 3px;
      background: white;
      transform: translateX(-50%);
    }

    .center-circle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 130px;
      height: 130px;
      border: 3px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* GOAL BOXES */
    .box-left,
    .box-right {
      position: absolute;
      top: 50%;
      width: 90px;
      height: 230px;
      border: 3px solid white;
      transform: translateY(-50%);
    }

    .box-left {
      left: 0;
      border-left: 0;
    }

    .box-right {
      right: 0;
      border-right: 0;
    }

    .goal-left,
    .goal-right {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 100px;
      background: #eee;
      border: 2px solid #222;
      transform: translateY(-50%);
    }

    .goal-left {
      left: -20px;
    }

    .goal-right {
      right: -20px;
    }

    /* PLAYERS */
    .player {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 3px 8px rgba(0,0,0,.5);
      z-index: 4;
    }

    .blue {
      background: #1677ff;
    }

    .red {
      background: #e52c38;
    }

    .player.active {
      outline: 4px solid #ffe600;
      box-shadow: 0 0 18px #ffe600;
    }

    /* BALL */
    .ball {
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border: 2px solid #222;
      border-radius: 50%;
      z-index: 6;
      box-shadow: 0 2px 5px rgba(0,0,0,.6);
    }

    /* CONTROLS */
    .controls {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .joystick {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: rgba(10,20,25,.7);
      border: 2px solid rgba(255,255,255,.35);
      position: relative;
      pointer-events: auto;
      touch-action: none;
    }

    .stick {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      border: 2px solid white;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(2, 70px);
      gap: 12px;
      pointer-events: auto;
    }

    .action-buttons button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid white;
      color: white;
      background: rgba(15,25,35,.85);
      font-weight: bold;
      font-size: 12px;
    }

    .action-buttons button:active {
      transform: scale(.92);
      background: #176bff;
    }

    .pass {
      background: rgba(0,120,255,.7) !important;
    }

    .shoot {
      background: rgba(220,35,45,.8) !important;
    }

    .sprint {
      background: rgba(20,160,80,.8) !important;
    }

    .tackle {
      background: rgba(210,150,20,.8) !important;
    }

    /* STATUS */
    .status {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 30;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 58px;
        padding: 0 10px;
      }

      .team {
        font-size: 11px;
      }

      .score {
        font-size: 22px;
      }

      .pitch-area {
        padding: 8px;
      }

      .pitch {
        width: 96vw;
        height: 65vh;
      }

      .center-circle {
        width: 90px;
        height: 90px;
      }

      .controls {
        bottom: 8px;
        left: 8px;
        right: 8px;
      }

      .joystick {
        width: 105px;
        height: 105px;
      }

      .stick {
        width: 48px;
        height: 48px;
      }

      .action-buttons {
        grid-template-columns: repeat(2, 60px);
        gap: 8px;
      }

      .action-buttons button {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

<div class="game">

  <!-- SCOREBOARD -->
  <div class="topbar">
    <div class="team">HOLO FC</div>

    <div style="text-align:center;">
      <div class="score">
        <span id="homeScore">0</span>
        -
        <span id="awayScore">0</span>
      </div>
      <div class="timer" id="timer">00:00</div>
    </div>

    <div class="team">RIVALS FC</div>
  </div>

  <!-- GAME -->
  <div class="pitch-area">

    <div class="status" id="status">
      HOLO STRIKER • READY
    </div>

    <div class="pitch" id="pitch">

      <div class="halfway"></div>
      <div class="center-circle"></div>
      <div class="center-dot"></div>

      <div class="box-left"></div>
      <div class="box-right"></div>

      <div class="goal-left"></div>
      <div class="goal-right"></div>

      <!-- BLUE TEAM -->
      <div class="player blue active" id="p1"
           style="left:18%; top:48%;">10</div>

      <div class="player blue"
           style="left:30%; top:25%;">7</div>

      <div class="player blue"
           style="left:30%; top:70%;">11</div>

      <div class="player blue"
           style="left:43%; top:48%;">9</div>

      <div class="player blue"
           style="left:8%; top:48%;">1</div>

      <!-- RED TEAM -->
      <div class="player red"
           style="left:78%; top:48%;">9</div>

      <div class="player red"
           style="left:68%; top:25%;">7</div>

      <div class="player red"
           style="left:68%; top:70%;">11</div>

      <div class="player red"
           style="left:57%; top:48%;">8</div>

      <div class="player red"
           style="left:90%; top:48%;">1</div>

      <!-- BALL -->
      <div class="ball" id="ball"
           style="left:47%; top:48%;"></div>

    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="joystick" id="joystick">
      <div class="stick" id="stick"></div>
    </div>

    <div class="action-buttons">
      <button class="pass" id="passBtn">PASS</button>
      <button class="shoot" id="shootBtn">SHOOT</button>
      <button class="sprint" id="sprintBtn">SPRINT</button>
      <button class="tackle" id="tackleBtn">TACKLE</button>
    </div>

  </div>

</div>

<script>
  const pitch = document.getElementById("pitch");
  const player = document.getElementById("p1");
  const ball = document.getElementById("ball");
  const stick = document.getElementById("stick");
  const joystick = document.getElementById("joystick");

  const statusText = document.getElementById("status");
  const timerText = document.getElementById("timer");

  let playerX = 18;
  let playerY = 48;

  let joystickActive = false;

  let gameSeconds = 0;

  /* MATCH TIMER */
  setInterval(() => {
    gameSeconds++;

    const minutes = Math.floor(gameSeconds / 60)
      .toString()
      .padStart(2, "0");

    const seconds = (gameSeconds % 60)
      .toString()
      .padStart(2, "0");

    timerText.textContent = minutes + ":" + seconds;
  }, 1000);


  /* MOVE PLAYER */
  function movePlayer(dx, dy) {

    playerX += dx;
    playerY += dy;

    if (playerX < 3) playerX = 3;
    if (playerX > 94) playerX = 94;

    if (playerY < 5) playerY = 5;
    if (playerY > 88) playerY = 88;

    player.style.left = playerX + "%";
    player.style.top = playerY + "%";

    /* Keep ball near player */
    ball.style.left = (playerX + 3) + "%";
    ball.style.top = (playerY + 1) + "%";

    statusText.textContent = "PLAYER 10 • MOVING";
  }


  /* KEYBOARD CONTROLS */
  document.addEventListener("keydown", (event) => {

    const speed = 1.2;

    if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
      movePlayer(0, -speed);
    }

    if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
      movePlayer(0, speed);
    }

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
      movePlayer(-speed, 0);
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
      movePlayer(speed, 0);
    }
  });


  /* JOYSTICK */
  function joystickMove(clientX, clientY) {

    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const maxDistance = 42;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > maxDistance) {
      dx = dx / distance * maxDistance;
      dy = dy / distance * maxDistance;
    }

    stick.style.left = `calc(50% + ${dx}px)`;
    stick.style.top = `calc(50% + ${dy}px)`;

    const moveX = dx / maxDistance * 0.8;
    const moveY = dy / maxDistance * 0.8;

    movePlayer(moveX, moveY);
  }


  joystick.addEventListener("pointerdown", (e) => {
    joystickActive = true;
    joystick.setPointerCapture(e.pointerId);
    joystickMove(e.clientX, e.clientY);
  });


  joystick.addEventListener("pointermove", (e) => {
    if (!joystickActive) return;

    joystickMove(e.clientX, e.clientY);
  });


  joystick.addEventListener("pointerup", () => {
    joystickActive = false;

    stick.style.left = "50%";
    stick.style.top = "50%";

    statusText.textContent = "HOLO STRIKER • READY";
  });


  /* PASS */
  document.getElementById("passBtn").addEventListener("click", () => {

    statusText.textContent = "PASS • BALL PASSED";

    ball.style.left = (playerX + 12) + "%";

    setTimeout(() => {
      statusText.textContent = "PLAYER 10 • READY";
    }, 900);
  });


  /* SHOOT */
  document.getElementById("shootBtn").addEventListener("click", () => {

    statusText.textContent = "SHOOT • ⚽";

    ball.style.left = "88%";

    setTimeout(() => {

      statusText.textContent = "SHOT TAKEN";

      setTimeout(() => {
        ball.style.left = (playerX + 3) + "%";
        ball.style.top = (playerY + 1) + "%";
        statusText.textContent = "PLAYER 10 • READY";
      }, 900);

    }, 500);
  });


  /* SPRINT */
  document.getElementById("sprintBtn").addEventListener("click", () => {

    statusText.textContent = "SPRINT • ⚡";

    movePlayer(5, 0);

    setTimeout(() => {
      statusText.textContent = "PLAYER 10 • READY";
    }, 700);
  });


  /* TACKLE */
  document.getElementById("tackleBtn").addEventListener("click", () => {

    statusText.textContent = "TACKLE • DEFENDING";

    setTimeout(() => {
      statusText.textContent = "PLAYER 10 • READY";
    }, 800);
  });

</script>

</body>
  </html>
