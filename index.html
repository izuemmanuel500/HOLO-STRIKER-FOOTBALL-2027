<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>HOLO STRIKER FOOTBALL 2027</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    height:55px;
    padding:8px 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#00ffff;
    background:rgba(0,0,0,.72);
    border-bottom:2px solid #00ffff;

    font-size:12px;
    font-weight:900;
}

#score{
    font-size:17px;
    color:white;
}

#status{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);

    z-index:20;

    padding:7px 14px;
    border:1px solid #00ffff;
    border-radius:20px;

    background:rgba(0,0,0,.65);
    color:#00ffff;

    font-size:11px;
    font-weight:bold;
}

#joy{
    position:absolute;
    left:18px;
    bottom:22px;

    width:125px;
    height:125px;

    border-radius:50%;
    border:2px solid #00ffff;

    background:rgba(0,255,255,.10);

    box-shadow:
        0 0 20px rgba(0,255,255,.7),
        inset 0 0 20px rgba(0,255,255,.15);

    z-index:30;
}

#stick{
    position:absolute;

    left:35px;
    top:35px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 15px #fff,
        0 0 30px #00ffff;
}

.control{
    position:absolute;

    z-index:30;

    display:grid;
    place-items:center;

    border-radius:50%;

    color:#00ffff;

    background:rgba(0,255,255,.10);

    border:2px solid #00ffff;

    box-shadow:
        0 0 18px rgba(0,255,255,.7);
}

#shoot{
    right:145px;
    bottom:35px;

    width:78px;
    height:78px;

    font-size:28px;
}

#skill{
    right:28px;
    bottom:85px;

    width:92px;
    height:92px;

    font-size:12px;
    font-weight:900;
}

#sprint{
    right:35px;
    bottom:25px;

    width:55px;
    height:55px;

    font-size:10px;
    font-weight:bold;
}

#power{
    position:absolute;

    right:155px;
    bottom:120px;

    width:90px;
    height:7px;

    background:rgba(255,255,255,.25);

    border-radius:10px;

    overflow:hidden;

    z-index:31;
}

#powerFill{
    width:0%;
    height:100%;
    background:#00ffff;
}

@media(max-width:500px){

    #ui{
        height:50px;
        font-size:10px;
    }

    #score{
        font-size:15px;
    }

}
</style>

<script type="importmap">
{
    "imports":{
        "three":
        "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="ui">

    <span>⚽ HOLO STRIKER 2027</span>

    <span id="score">
        0 - 0
    </span>

    <span id="clock">
        00:00
    </span>

</div>

<div id="status">
    KICK OFF
</div>

<div id="joy">
    <div id="stick"></div>
</div>

<div id="shoot" class="control">
    ⤴
</div>

<div id="skill" class="control">
    SKILL
</div>

<div id="sprint" class="control">
    RUN
</div>

<div id="power">
    <div id="powerFill"></div>
</div>


<script type="module">

import * as THREE from "three";


/* =====================================================
   GAME SETUP
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x020914);


const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    9,
    12
);


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );

scene.add(ambient);


const stadiumLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

stadiumLight.position.set(
    5,
    15,
    5
);

stadiumLight.castShadow = true;

scene.add(stadiumLight);


/* =====================================================
   PITCH
===================================================== */

const pitchWidth = 30;
const pitchLength = 50;


const pitchGeometry =
    new THREE.PlaneGeometry(
        pitchWidth,
        pitchLength
    );


const pitchMaterial =
    new THREE.MeshStandardMaterial({
        color:0x075c17,
        roughness:0.8
    });


const pitch =
    new THREE.Mesh(
        pitchGeometry,
        pitchMaterial
    );


pitch.rotation.x =
    -Math.PI / 2;

pitch.receiveShadow = true;

scene.add(pitch);


/* =====================================================
   PITCH LINES
===================================================== */

function line(
    x,
    z,
    width,
    depth
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            0.025,
            depth
        );

    const material =
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        0.03,
        z
    );

    scene.add(mesh);

    return mesh;
}


/* sidelines */

line(-15,0,.08,50);
line(15,0,.08,50);


/* goal lines */

line(0,-25,30,.08);
line(0,25,30,.08);


/* halfway line */

line(0,0,30,.06);


/* centre circle */

const circle =
    new THREE.RingGeometry(
        4.8,
        4.86,
        64
    );

const circleMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide
    });

const centreCircle =
    new THREE.Mesh(
        circle,
        circleMaterial
    );

centreCircle.rotation.x =
    -Math.PI / 2;

centreCircle.position.y =
    0.04;

scene.add(centreCircle);


/* =====================================================
   GOAL
===================================================== */

function createGoal(z){

    const material =
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });


    const left =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .15,
                2.8,
                .15
            ),
            material
        );


    const right =
        left.clone();


    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                6.2,
                .15,
                .15
            ),
            material
        );


    left.position.set(
        -3,
        1.4,
        z
    );


    right.position.set(
        3,
        1.4,
        z
    );


    top.position.set(
        0,
        2.8,
        z
    );


    scene.add(
        left,
        right,
        top
    );
}


createGoal(-25);
createGoal(25);


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Group();


const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .42,
            1,
            6,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x00ff88
        })
    );


body.position.y = 1;

body.castShadow = true;


const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .35,
            16,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0xffd1ad
        })
    );


head.position.y =
    1.9;

head.castShadow = true;


player.add(
    body,
    head
);


player.position.set(
    0,
    0,
    8
);


scene.add(player);


/* =====================================================
   BALL
===================================================== */

const ball =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .27,
            20,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xffffff
        })
    );


ball.castShadow = true;

ball.position.set(
    0,
    .27,
    7.2
);

scene.add(ball);


/* =====================================================
   GAME VARIABLES
===================================================== */

let joyX = 0;
let joyY = 0;

let ballVelocity =
    new THREE.Vector3();

let shooting = false;

let shootPower = 0;

let scoreHome = 0;
let scoreAway = 0;

let matchSeconds = 0;


/* =====================================================
   JOYSTICK
===================================================== */

const joy =
    document.getElementById(
        "joy"
    );

const stick =
    document.getElementById(
        "stick"
    );


function joystickMove(
    touch
){

    const rect =
        joy.getBoundingClientRect();


    let x =
        touch.clientX -
        rect.left -
        rect.width / 2;


    let y =
        touch.clientY -
        rect.top -
        rect.height / 2;


    const distance =
        Math.hypot(x,y);


    const max =
        38;


    if(distance > max){

        x =
            x / distance *
            max;

        y =
            y / distance *
            max;

    }


    stick.style.transform =
        `translate(${x}px,${y}px)`;


    joyX =
        x / max;


    joyY =
        y / max;

}


joy.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        joystickMove(
            e.touches[0]
        );

    },
    {passive:false}
);


joy.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        joystickMove(
            e.touches[0]
        );

    },
    {passive:false}
);


joy.addEventListener(
    "touchend",
    () => {

        joyX = 0;
        joyY = 0;

        stick.style.transform =
            "translate(0,0)";

    }
);


/* =====================================================
   SHOOT
===================================================== */

const shoot =
    document.getElementById(
        "shoot"
    );

const powerFill =
    document.getElementById(
        "powerFill"
    );


shoot.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        shooting = true;

        shootPower = 0;

    },
    {passive:false}
);


shoot.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        if(!shooting)
            return;


        shooting = false;


        const power =
            7 +
            shootPower * 12;


        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );


        direction.applyQuaternion(
            player.quaternion
        );


        ballVelocity.copy(
            direction.multiplyScalar(
                power
            )
        );


        ballVelocity.y =
            3 +
            shootPower * 4;


        document.getElementById(
            "status"
        ).textContent =
            "SHOT!";


        powerFill.style.width =
            "0%";

    }
);


/* =====================================================
   SKILL
===================================================== */

document.getElementById(
    "skill"
).addEventListener(
    "touchstart",
    () => {

        player.rotation.y +=
            Math.PI * 2;

        document.getElementById(
            "status"
        ).textContent =
            "SKILL MOVE!";

    }
);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(
    delta
){

    const moving =
        Math.abs(joyX) >
        .05 ||
        Math.abs(joyY) >
        .05;


    if(!moving)
        return;


    const speed =
        7 * delta;


    const movement =
        new THREE.Vector3(
            joyX,
            0,
            joyY
        );


    player.position.x +=
        movement.x *
        speed;


    player.position.z +=
        movement.z *
        speed;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -14,
            14
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -23,
            23
        );


    const angle =
        Math.atan2(
            joyX,
            joyY
        );


    player.rotation.y =
        angle;


    /* ball control */

    const ballDistance =
        player.position.distanceTo(
            ball.position
        );


    if(ballDistance < 1.5){

        const target =
            new THREE.Vector3(
                0,
                .27,
                1.0
            );


        target.applyQuaternion(
            player.quaternion
        );


        target.add(
            player.position
        );


        ball.position.lerp(
            target,
            .25
        );


        ballVelocity.set(
            0,
            0,
            0
        );

    }

}


/* =====================================================
   BALL PHYSICS
===================================================== */

function updateBall(delta){

    if(
        ballVelocity.length() <
        .01
    )
        return;


    ball.position.addScaledVector(
        ballVelocity,
        delta
    );


    ballVelocity.y -=
        9.8 * delta;


    ballVelocity.multiplyScalar(
        .985
    );


    if(ball.position.y < .27){

        ball.position.y =
            .27;

        ballVelocity.y *=
            -.45;

        ballVelocity.x *=
            .92;

        ballVelocity.z *=
            .92;

    }


    /* side boundaries */

    if(
        ball.position.x <
        -14.5 ||
        ball.position.x >
        14.5
    ){

        ballVelocity.x *=
            -.7;

    }


    /* goal detection */

    if(
        ball.position.z <
        -25 &&
        Math.abs(
            ball.position.x
        ) < 3
    ){

        scoreHome++;

        resetAfterGoal(
            "GOAL! HOLO STRIKER!"
        );

    }


    if(
        ball.position.z >
        25 &&
        Math.abs(
            ball.position.x
        ) < 3
    ){

        scoreAway++;

        resetAfterGoal(
            "GOAL! OPPONENT!"
        );

    }

}


/* =====================================================
   GOAL RESET
===================================================== */

function resetAfterGoal(
    message
){

    document.getElementById(
        "status"
    ).textContent =
        message;


    document.getElementById(
        "score"
    ).textContent =
        `${scoreHome} - ${scoreAway}`;


    ballVelocity.set(
        0,
        0,
        0
    );


    ball.position.set(
        0,
        .27,
        0
    );


    player.position.set(
        0,
        0,
        8
    );

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    const target =
        new THREE.Vector3(
            player.position.x,
            0,
            player.position.z
        );


    const desired =
        new THREE.Vector3(
            player.position.x,
            8,
            player.position.z + 10
        );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target
    );

}


/* =====================================================
   MATCH TIMER
===================================================== */

let timerAccumulator = 0;


function updateClock(delta){

    timerAccumulator += delta;


    if(
        timerAccumulator >= 1
    ){

        timerAccumulator = 0;

        matchSeconds++;


        const minutes =
            Math.floor(
                matchSeconds / 60
            );


        const seconds =
            matchSeconds % 60;


        document.getElementById(
            "clock"
        ).textContent =
            `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    }

}


/* =====================================================
   MAIN LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(shooting){

        shootPower =
            Math.min(
                1,
                shootPower +
                delta * .8
            );


        powerFill.style.width =
            `${shootPower * 100}%`;

    }


    updatePlayer(
        delta
    );


    updateBall(
        delta
    );


    updateCamera();


    updateClock(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
