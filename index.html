<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HOLO STRIKER FOOTBALL 2027</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061008;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#061008}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:5;pointer-events:none}
.box{background:rgba(3,7,5,.86);border:1px solid rgba(255,255,255,.22);border-radius:18px;color:#fff;font-weight:800;box-shadow:0 8px 25px #0008}
#team{padding:14px 20px;font-size:20px}.dot{display:inline-block;width:17px;height:17px;background:#16a8ff;border-radius:50%;vertical-align:-2px;margin-right:9px}
#score{padding:14px 22px;font-size:28px;letter-spacing:3px}
#clock{padding:14px 18px;font-size:21px;font-variant-numeric:tabular-nums}
#title{position:fixed;top:88px;left:0;right:0;text-align:center;color:#fff;font-size:25px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 10px #000;z-index:4;pointer-events:none}
#title b{color:#08c8ff}
#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;color:#fff;text-align:center;font-size:20px;font-weight:800;background:#020604dd;padding:20px 25px;border:1px solid #ffffff33;border-radius:18px;display:none}
#controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));height:230px;z-index:7;pointer-events:none}
#joystick{position:absolute;left:38px;bottom:8px;width:155px;height:155px;border:3px solid #ffffff32;background:#142019cc;border-radius:50%;pointer-events:auto}
#stick{position:absolute;left:50%;top:50%;width:68px;height:68px;transform:translate(-50%,-50%);border-radius:50%;background:#737c78;border:3px solid #dce3e0aa;box-shadow:0 5px 15px #0008}
.action{position:absolute;border-radius:50%;border:3px solid #ffffff44;color:#fff;font-weight:900;pointer-events:auto;user-select:none}
#skill{right:220px;bottom:18px;width:100px;height:100px;background:#202d42;font-size:16px}
#shoot{right:22px;bottom:0;width:155px;height:155px;background:#0798e8;font-size:19px;box-shadow:0 7px 20px #0008}
#hint{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#aab3ae;font-size:13px;font-weight:700;letter-spacing:.5px}
@media(max-width:500px){
 #hud{padding:0 18px}.box{border-radius:15px}
 #team{font-size:17px;padding:12px 15px}.dot{width:14px;height:14px}
 #score{font-size:23px;padding:12px 17px}.clock{font-size:18px}
 #title{top:87px;font-size:22px}
 #controls{height:215px}
 #joystick{left:38px;width:150px;height:150px}
 #shoot{width:150px;height:150px}
 #skill{right:218px;width:98px;height:98px}
}
@media(max-width:390px){
 #team{display:none}#hud{justify-content:space-around}
 #skill{right:180px;width:88px;height:88px}
 #shoot{width:135px;height:135px}
 #joystick{left:25px;width:140px;height:140px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="team" class="box"><span class="dot"></span>HOLO FC</div>
  <div id="score" class="box">0 - 0</div>
  <div id="clock" class="box">00:00</div>
</div>
<div id="title">HOLO <b>STRIKER</b> 2027</div>
<div id="message"></div>

<div id="controls">
  <div id="joystick"><div id="stick"></div></div>
  <button id="skill" class="action">SKILL</button>
  <button id="shoot" class="action">SHOOT</button>
  <div id="hint">MOVE • HOLD SHOOT • RELEASE TO KICK</div>
</div>

<script>
(() => {
"use strict";

/* HOLO STRIKER 2027
   Standalone Canvas version.
   No Three.js, no modules, no external libraries.
*/

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
if(!ctx){ document.getElementById("message").style.display="block"; document.getElementById("message").textContent="Your browser cannot create a game canvas."; return; }

let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const field={w:68,h:108};
const player={x:0,y:18,vx:0,vy:0,team:"blue",name:"YOU",speed:20,dir:0};
const ball={x:0,y:12,vx:0,vy:0,z:0,vz:0,owner:null};
let blue=[],red=[];
let scoreBlue=0,scoreRed=0,gameSeconds=0,last=performance.now();
let cameraY=18,charge=0,shooting=false,skillCooldown=0;
let flash=0,goalText="",goalTimer=0;

function makePlayer(x,y,team,name,number){
 return {x,y,vx:0,vy:0,team,name,number,homeX:x,homeY:y,dir:team==="blue"?-1:1,run:Math.random()*6};
}
const bluePos=[
 [-22,38],[-7,43],[7,43],[22,38],[-25,24],[-9,28],[9,28],[25,24],[-15,8],[15,8],[0,18]
];
const redPos=[
 [22,-38],[7,-43],[-7,-43],[-22,-38],[25,-24],[9,-28],[-9,-28],[-25,-24],[15,-8],[-15,-8],[0,-18]
];
blue=bluePos.map((p,i)=>makePlayer(p[0],p[1],"blue",i===10?"YOU":"HOLO",i+1));
red=redPos.map((p,i)=>makePlayer(p[0],p[1],"red","RIVAL",i+1));
Object.assign(player,blue[10]);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function lerp(a,b,t){return a+(b-a)*t}

let joyX=0,joyY=0;
const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
function setJoy(e){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const px=e.clientX-cx,py=e.clientY-cy,max=r.width*.32;
 const d=Math.hypot(px,py),k=d>max?max/d:1;
 joyX=(px*k)/max;joyY=(py*k)/max;
 stick.style.left=(50+joyX*32)+"%";stick.style.top=(50+joyY*32)+"%";
}
function resetJoy(){joyX=joyY=0;stick.style.left="50%";stick.style.top="50%"}
joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener("pointermove",e=>{if(e.buttons)setJoy(e)});
joy.addEventListener("pointerup",resetJoy);joy.addEventListener("pointercancel",resetJoy);

const shootBtn=document.getElementById("shoot");
shootBtn.addEventListener("pointerdown",e=>{e.preventDefault();shooting=true});
shootBtn.addEventListener("pointerup",e=>{e.preventDefault();shooting=false;kick()});
shootBtn.addEventListener("pointercancel",()=>{shooting=false;kick()});

document.getElementById("skill").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(skillCooldown<=0){
   const dx=joyX||player.dir;
   const dy=joyY||-player.dir;
   player.x=clamp(player.x+dx*8,-30,30);
   player.y=clamp(player.y+dy*8,-51,51);
   skillCooldown=1.2;
 }
});

function kick(){
 const d=dist(player,ball);
 if(d>4.4)return;
 const power=28+charge*25;
 let dx=joyX,dy=joyY;
 if(Math.hypot(dx,dy)<.15){dx=0;dy=-1}
 const len=Math.hypot(dx,dy)||1;
 ball.owner=null;
 ball.x=player.x+dx/len*2.2;
 ball.y=player.y+dy/len*2.2;
 ball.vx=dx/len*power;
 ball.vy=dy/len*power;
 ball.vz=5+charge*5;
 charge=0;
}

function resetPositions(){
 blue.forEach((p,i)=>{p.x=bluePos[i][0];p.y=bluePos[i][1];p.vx=p.vy=0});
 red.forEach((p,i)=>{p.x=redPos[i][0];p.y=redPos[i][1];p.vx=p.vy=0});
 Object.assign(player,blue[10]);
 ball.x=0;ball.y=0;ball.vx=ball.vy=ball.vz=0;ball.owner=null;
 cameraY=player.y;
}

function goal(team){
 if(team==="blue")scoreBlue++;else scoreRed++;
 document.getElementById("score").textContent=scoreBlue+" - "+scoreRed;
 goalText=team==="blue"?"GOAL! HOLO FC":"GOAL! RIVAL";
 goalTimer=2.2;flash=.35;
 resetPositions();
}

function update(dt){
 gameSeconds+=dt;
 skillCooldown=Math.max(0,skillCooldown-dt);
 flash=Math.max(0,flash-dt);
 goalTimer=Math.max(0,goalTimer-dt);

 // Player movement
 let mx=joyX,my=joyY;
 player.vx=lerp(player.vx,mx*player.speed,Math.min(1,dt*9));
 player.vy=lerp(player.vy,my*player.speed,Math.min(1,dt*9));
 player.x=clamp(player.x+player.vx*dt,-30,30);
 player.y=clamp(player.y+player.vy*dt,-51,51);
 if(Math.hypot(mx,my)>.1)player.dir=my<0?-1:1;

 if(shooting)charge=clamp(charge+dt*1.6,0,1);

 // AI
 const everyone=[...blue,...red];
 for(const p of everyone){
   if(p===player)continue;
   const target=ball.owner ? (ball.owner.team!==p.team?ball.owner:{x:p.homeX,y:p.homeY}) : ball;
   let tx=target.x,ty=target.y;
   const d=Math.hypot(tx-p.x,ty-p.y);
   if(d>2.5){p.vx=(tx-p.x)/d*10;p.vy=(ty-p.y)/d*10}
   else {p.vx*=.8;p.vy*=.8}
   p.x+=p.vx*dt;p.y+=p.vy*dt;
   p.x=clamp(p.x,-30,30);p.y=clamp(p.y,-51,51);
 }

 // Ball owner / stealing
 if(!ball.owner){
   for(const p of everyone){
     if(dist(p,ball)<2.0 && Math.hypot(ball.vx,ball.vy)<9){
       ball.owner=p;ball.vx=ball.vy=0;break;
     }
   }
 }else{
   const p=ball.owner;
   const forward=p.team==="blue"?-1:1;
   ball.x=p.x;ball.y=p.y+forward*2.0;
   for(const q of everyone){
     if(q!==p && q.team!==p.team && dist(q,p)<1.5){
       ball.owner=null;ball.vx=(p.x-q.x)*8;ball.vy=(p.y-q.y)*8;break;
     }
   }
   // AI players occasionally shoot
   if(p!==player && Math.random()<dt*.22 && Math.abs(p.y)>30){
     ball.owner=null;ball.vx=0;ball.vy=(p.team==="blue"?-1:1)*25;
   }
 }

 if(!ball.owner){
   ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
   ball.vx*=Math.pow(.985,dt*60);ball.vy*=Math.pow(.985,dt*60);
   ball.vz-=18*dt;ball.z+=ball.vz*dt;
   if(ball.z<0){ball.z=0;ball.vz*=-.35}
 }

 // Goals
 if(ball.y<-55 && Math.abs(ball.x)<8)goal("blue");
 if(ball.y>55 && Math.abs(ball.x)<8)goal("red");

 // side boundaries
 if(ball.x<-32||ball.x>32){ball.x=clamp(ball.x,-32,32);ball.vx*=-.6}
 if(ball.y<-54||ball.y>54){ball.y=clamp(ball.y,-54,54);ball.vy*=-.6}

 // Camera
 cameraY=lerp(cameraY,player.y,Math.min(1,dt*4));
}

function project(x,y,z=0){
 // simple perspective view: horizon near upper middle
 const horizon=H*.39;
 const depth=(y-cameraY+48);
 const scale=clamp(0.55+depth/115,0.38,1.55);
 const sx=W/2+(x*scale*W/70);
 const sy=horizon+(depth*scale*H/125);
 return {x:sx,y:sy,s:scale};
}

function line(a,b,width=1,color="#fff"){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

function drawPitch(){
 // ground
 ctx.fillStyle="#061008";ctx.fillRect(0,0,W,H);
 const tl=project(-34,-54),tr=project(34,-54),br=project(34,54),bl=project(-34,54);
 ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();
 ctx.fillStyle="#117b3a";ctx.fill();

 // stripes
 for(let y=-54;y<54;y+=9){
   const a=project(-34,y),b=project(34,y),c=project(34,y+9),d=project(-34,y+9);
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();
   ctx.fillStyle=(Math.floor((y+54)/9)%2)?"#126f35":"#0f7a3b";ctx.fill();
 }

 // field boundary
 line(tl,tr,2,"#fff");line(tr,br,2,"#fff");line(br,bl,2,"#fff");line(bl,tl,2,"#fff");

 // horizontal lines and center
 for(const y of [-36,-18,0,18,36]){
   const a=project(-34,y),b=project(34,y);line(a,b,y===0?2:1.2,"#ffffffdd");
 }
 // center circle
 const c=project(0,0),r=10*c.s;
 ctx.beginPath();ctx.arc(c.x,c.y,r,0,Math.PI*2);ctx.strokeStyle="#fff";ctx.lineWidth=1.7;ctx.stroke();
 ctx.beginPath();ctx.arc(c.x,c.y,1.5*c.s,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();

 // penalty boxes
 for(const yy of [-54,36]){
   const y2=yy<0?yy+18:yy-18;
   const p1=project(-17,yy),p2=project(17,yy),p3=project(17,y2),p4=project(-17,y2);
   ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.closePath();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
 }
 // goals
 drawGoal(-54);drawGoal(54);
}

function drawGoal(y){
 const p=project(0,y),s=p.s;
 const w=10*s,h=6*s;
 ctx.strokeStyle="#e9f1ef";ctx.lineWidth=Math.max(2,2*s);
 ctx.strokeRect(p.x-w/2,p.y-(y<0?h*.65:h*.15),w,h);
 ctx.strokeStyle="#ffffff55";ctx.lineWidth=1;
 for(let i=-2;i<=2;i++){line({x:p.x+i*w/5,y:p.y-(y<0?h*.65:h*.15)},{x:p.x+i*w/5,y:p.y-(y<0?h*.65:h*.15)+h},1,"#ffffff55")}
}

function drawPlayer(p){
 const q=project(p.x,p.y,p===player?0:0);
 const s=q.s;
 // shadow
 ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(q.x,q.y+9*s,8*s,3*s,0,0,Math.PI*2);ctx.fill();
 // legs
 const run=Math.sin(performance.now()/90+p.run)*2*s;
 ctx.strokeStyle="#101820";ctx.lineWidth=Math.max(3,4*s);
 line({x:q.x-3*s,y:q.y+5*s},{x:q.x-4*s+run,y:q.y+14*s},4*s,"#101820");
 line({x:q.x+3*s,y:q.y+5*s},{x:q.x+4*s-run,y:q.y+14*s},4*s,"#101820");
 // shoes
 ctx.fillStyle="#111";ctx.fillRect(q.x-6*s+run,q.y+12*s,5*s,2.5*s);ctx.fillRect(q.x+1*s-run,q.y+12*s,5*s,2.5*s);
 // body
 ctx.fillStyle=p.team==="blue"?"#078fe3":"#e42b3d";
 ctx.beginPath();ctx.roundRect(q.x-7*s,q.y-9*s,14*s,17*s,4*s);ctx.fill();
 // arms
 ctx.strokeStyle=p.team==="blue"?"#0578bb":"#bd1e2d";ctx.lineWidth=Math.max(3,4*s);
 line({x:q.x-7*s,y:q.y-5*s},{x:q.x-10*s,y:q.y+4*s},4*s,ctx.strokeStyle);
 line({x:q.x+7*s,y:q.y-5*s},{x:q.x+10*s,y:q.y+4*s},4*s,ctx.strokeStyle);
 // neck/head
 ctx.fillStyle="#d99a70";ctx.fillRect(q.x-2.5*s,q.y-12*s,5*s,4*s);
 ctx.beginPath();ctx.arc(q.x,q.y-15*s,5.8*s,0,Math.PI*2);ctx.fill();
 // hair
 ctx.fillStyle="#171717";ctx.beginPath();ctx.arc(q.x,q.y-17*s,5.5*s,Math.PI,Math.PI*2);ctx.fill();
 // number
 ctx.fillStyle="#fff";ctx.font=`bold ${Math.max(8,7*s)}px Arial`;ctx.textAlign="center";ctx.fillText(p.number,q.x,q.y+2*s);
 // user ring
 if(p===player){
   ctx.strokeStyle="#66e8ff";ctx.lineWidth=2;
   ctx.beginPath();ctx.ellipse(q.x,q.y+10*s,12*s,4*s,0,0,Math.PI*2);ctx.stroke();
 }
}

function drawBall(){
 const q=project(ball.x,ball.y,ball.z);
 const r=Math.max(3,4.3*q.s);
 ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(q.x,q.y+5*q.s,r*1.2,r*.45,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#111";ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(q.x,q.y,r*.25,0,Math.PI*2);ctx.fill();
}

function draw(){
 drawPitch();
 const all=[...blue,...red].sort((a,b)=>a.y-b.y);
 for(const p of all)drawPlayer(p);
 drawBall();

 if(shooting){
   const bw=190,bh=9,x=W/2-bw/2,y=H-260;
   ctx.fillStyle="#0009";ctx.fillRect(x,y,bw,bh);
   ctx.fillStyle="#18c7ff";ctx.fillRect(x,y,bw*charge,bh);
 }
 if(goalTimer>0){
   ctx.fillStyle="#ffffff";ctx.textAlign="center";ctx.font="900 38px Arial";ctx.fillText(goalText,W/2,H*.27);
 }
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H)}
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 update(dt);draw();
 const m=Math.floor(gameSeconds/60),s=Math.floor(gameSeconds%60);
 document.getElementById("clock").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 requestAnimationFrame(loop);
}
resetPositions();
requestAnimationFrame(loop);
})();
</script>
</body>
 </html>
