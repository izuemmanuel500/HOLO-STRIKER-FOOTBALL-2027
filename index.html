<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOLO STRIKER FOOTBALL 2027</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:system-ui;font-weight:800}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;right:0;height:42px;background:rgba(0,10,30,0.9);border-bottom:2px solid #0ff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#0ff;z-index:20;font-size:13px;letter-spacing:1px}
#joy{position:fixed;left:15px;bottom:25px;width:120px;height:120px;border-radius:50%;border:2px solid #0ff;background:rgba(0,255,255,0.12);z-index:20}
#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:linear-gradient(#fff,#aaa);box-shadow:0 0 15px #fff;will-change:transform}
#shot{position:fixed;left:155px;bottom:35px;width:70px;height:70px;border-radius:50%;border:2px solid #ffe600;background:rgba(255,230,0,0.15);color:#ffe600;display:grid;place-items:center;z-index:20;box-shadow:0 0 15px #ffe600}
#skill{position:fixed;right:15px;bottom:95px;width:80px;height:80px;border-radius:50%;border:2px solid #0ff;background:rgba(0,255,255,0.15);color:#0ff;display:grid;place-items:center;z-index:20;box-shadow:0 0 15px #0ff}
#run{position:fixed;right:15px;bottom:15px;width:60px;height:60px;border-radius:50%;border:2px solid #0ff;background:rgba(0,255,255,0.08);color:#0ff;display:grid;place-items:center;font-size:12px;z-index:20}
#goalText{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;color:#0ff;border:2px solid #0ff;padding:12px 25px;border-radius:30px;font-size:22px;display:none;z-index:30;box-shadow:0 0 30px #0ff}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui"><span>HOLO STRIKER 2027</span><span id="score">0 - 0</span><span id="fps">60FPS</span></div>
<div id="goalText">GOOOAL!!!</div>
<div id="joy"><div id="stick"></div></div>
<div id="shot">SHOT</div>
<div id="skill">SKILL</div>
<div id="run">RUN</div>

<script type="module">
import * as THREE from 'three';

// PERFORMANCE SETTINGS
const isMobile = /Android|iPhone/i.test(navigator.userAgent);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e2a0e);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,9,13);
const renderer = new THREE.WebGLRenderer({antialias:!isMobile, powerPreference:"high-performance"});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // HIGH PERFORMANCE
renderer.shadowMap.enabled = false; // OFF FOR 60FPS
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(5,10,5); scene.add(dirLight);

// PITCH - LOW POLY
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(32, 60), new THREE.MeshStandardMaterial({color:0x1e8a1e}));
pitch.rotation.x = -Math.PI/2; scene.add(pitch);
const grid = new THREE.GridHelper(32, 16, 0xffffff, 0x2a6a2a); grid.position.y=0.01; scene.add(grid);

// PLAYER - REAL MESH NOT CAPSULE
const player = new THREE.Group();
const matGreen = new THREE.MeshStandardMaterial({color:0x00ff88});
const matSkin = new THREE.MeshStandardMaterial({color:0xdcb898});
const matBlack = new THREE.MeshStandardMaterial({color:0x111111});
const body = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.9,0.4), matGreen); body.position.y=1.1;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.35,12,12), matSkin); head.position.y=1.95;
const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.7,0.22), matBlack); legL.position.set(-0.18,0.35,0);
const legR = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.7,0.22), matBlack); legR.position.set(0.18,0.35,0);
player.add(body,head,legL,legR); player.position.set(0,0,8); scene.add(player);

// BALL - HIGH PERFORMANCE
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.26,10,10), new THREE.MeshStandardMaterial({color:0xffffff}));
ball.position.set(0,0.26,9.5); scene.add(ball);

// GOAL
const goalMat = new THREE.MeshStandardMaterial({color:0xffffff});
const g1 = new THREE.Mesh(new THREE.BoxGeometry(0.1,2,0.1), goalMat); g1.position.set(-3.2,1,-22);
const g2 = new THREE.Mesh(new THREE.BoxGeometry(0.1,2,0.1), goalMat); g2.position.set(3.2,1,-22);
const g3 = new THREE.Mesh(new THREE.BoxGeometry(6.5,0.1,0.1), goalMat); g3.position.set(0,2,-22);
scene.add(g1,g2,g3);

let sx=0, sy=0, run=false, score=0, walk=0, ballVel=new THREE.Vector3(0,0,0), hasBall=true;
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove', e=>{
  const r=joy.getBoundingClientRect(); let x=e.touches[0].clientX-r.left-60, y=e.touches[0].clientY-r.top-60;
  const d=Math.hypot(x,y); if(d>40){x=x/d*40; y=y/d*40} stick.style.transform=`translate3d(${x}px,${y}px,0)`; sx=x/40; sy=y/40;
},{passive:false});
joy.addEventListener('touchend', ()=>{stick.style.transform='translate3d(0,0,0)'; sx=0; sy=0;});
document.getElementById('run').addEventListener('touchstart',()=>run=true);
document.getElementById('run').addEventListener('touchend',()=>run=false);

document.getElementById('shot').addEventListener('touchstart', ()=>{
  if(player.position.distanceTo(ball.position)>2) return;
  hasBall=false;
  ballVel.set((Math.random()-0.5)*0.15, 0.25, -0.7 - (run?0.4:0));
