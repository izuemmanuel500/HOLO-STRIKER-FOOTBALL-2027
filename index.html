<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HOLO STRIKER FOOTBALL 2027</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#06110a;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#hud{
 position:fixed;top:10px;left:50%;transform:translateX(-50%);
 z-index:10;width:94%;max-width:650px;
 display:flex;align-items:center;justify-content:space-between;
 color:white;pointer-events:none
}
.box{
 background:rgba(0,0,0,.7);border:1px solid #ffffff35;
 border-radius:12px;padding:8px 12px;
 backdrop-filter:blur(8px);font-weight:900
}
#score{font-size:22px}
#title{
 position:fixed;top:62px;left:50%;transform:translateX(-50%);
 color:white;font-size:18px;font-weight:900;letter-spacing:2px;
 z-index:5;white-space:nowrap;text-shadow:0 3px 10px #000
}
#title span{color:#00e5ff}

#message{
 position:fixed;top:105px;left:50%;transform:translateX(-50%);
 z-index:20;color:white;background:#000b;padding:8px 15px;
 border-radius:20px;font-weight:900;opacity:0;transition:.2s;
 pointer-events:none
}
#message.show{opacity:1}

#joystick{
 position:fixed;left:20px;bottom:25px;width:130px;height:130px;
 border-radius:50%;border:2px solid #ffffff35;
 background:#ffffff12;z-index:30;touch-action:none
}
#stick{
 position:absolute;left:50%;top:50%;width:58px;height:58px;
 margin:-29px;border-radius:50%;
 background:#ffffff45;border:2px solid #ffffff70
}

#buttons{
 position:fixed;right:20px;bottom:28px;
 display:flex;align-items:flex-end;gap:14px;z-index:30
}
button{
 border-radius:50%;color:white;font-weight:900;
 touch-action:none;border:2px solid #ffffff55
}
#skill{
 width:68px;height:68px;background:#222d3d;font-size:11px
}
#shoot{
 width:92px;height:92px;background:#008fe8;font-size:14px
}
#power{
 position:fixed;left:50%;bottom:175px;transform:translateX(-50%);
 width:220px;height:12px;background:#0009;border-radius:20px;
 overflow:hidden;border:1px solid #fff4;z-index:30
}
#powerFill{height:100%;width:0;background:#00e5ff}

#help{
 position:fixed;bottom:7px;left:50%;transform:translateX(-50%);
 color:#fff9;font-size:10px;z-index:5;white-space:nowrap
}

@media(max-height:550px){
 #joystick{width:105px;height:105px}
 #stick{width:48px;height:48px;margin:-24px}
 #shoot{width:72px;height:72px}
 #skill{width:55px;height:55px}
 #power{bottom:120px}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="box">🔵 HOLO FC</div>
  <div class="box" id="score">0 - 0</div>
  <div class="box" id="timer">00:00</div>
</div>

<div id="title">HOLO <span>STRIKER</span> 2027</div>
<div id="message"></div>

<div id="power">
  <div id="powerFill"></div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="buttons">
  <button id="skill">SKILL</button>
  <button id="shoot">SHOOT</button>
</div>

<div id="help">MOVE • HOLD SHOOT • RELEASE TO KICK</div>

<!-- IMPORTANT: normal script, NOT module -->

renderer.shadowMap.enabled=true;

document.getElementById("game").appendChild(renderer.domElement);

========================================================= */

  0xffffff,
  0x183020,
  2.2

  color:0x071b10,
  roughness:1
 })
);

ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

========================================================= */

 new THREE.MeshStandardMaterial({
  color:0x13803d,
  roughness:.9
 })
);

pitch.rotation.x=-Math.PI/2;
pitch.receiveShadow=true;
scene.add(pitch);

   transparent:true,
   opacity:.25
  })
 );

 stripe.rotation.x=-Math.PI/2;
 stripe.position.set(i*2,0.01,0);

 scene.add(stripe);
}


/* =========================================================
   FIELD LINES
========================================================= */

function line(x1,z1,x2,z2){

 geometry.setFromPoints([
  new THREE.Vector3(x1,.035,z1),
  new THREE.Vector3(x2,.035,z2)
 ]);

 const l=new THREE.Line(
  geometry,
  new THREE.LineBasicMaterial({color:0xffffff})
 );

 scene.add(l);
}

line(-17,29,17,29);
line(-17,-29,-17,29);
line(17,-29,17,29);
line(-17,0,17,0);
