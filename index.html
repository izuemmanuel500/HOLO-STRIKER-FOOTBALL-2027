<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>HOLO STRIKER FOOTBALL 2027 - REAL HUMAN</title>
<style>*{margin:0;padding:0;touch-action:none}body{overflow:hidden;background:#000}canvas{display:block}#top{position:fixed;top:0;left:0;right:0;height:40px;background:rgba(0,0,0,.8);color:#0ff;display:flex;justify-content:space-between;padding:0 10px;align-items:center;font-family:sans-serif;font-weight:900;border-bottom:2px solid #0ff;z-index:10}#joy{position:fixed;left:15px;bottom:20px;width:120px;height:120px;border-radius:50%;border:2px solid #0ff;background:rgba(0,255,255,.1);z-index:10}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}#shot{position:fixed;left:160px;bottom:25px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,0,.2);border:2px solid #ff0;color:#ff0;display:grid;place-items:center;font-weight:900;z-index:10}#run{position:fixed;right:15px;bottom:15px;width:70px;height:70px;border-radius:50%;background:rgba(0,255,255,.15);border:2px solid #0ff;color:#0ff;display:grid;place-items:center;z-index:10}</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="top"><span>HOLO STRIKER 2027 - HUMAN</span><span id="score">0-0 LIVE 78:32</span></div>
<div id="joy"><div id="stick"></div></div><div id="shot">SHOT</div><div id="run">RUN</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1a0a);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100); camera.position.set(0,4,8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1.2); document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.5));
const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(5,10,5); scene.add(light);

const pitch=new THREE.Mesh(new THREE.PlaneGeometry(50,80), new THREE.MeshStandardMaterial({color:0x1e7a1e})); pitch.rotation.x=-Math.PI/2; scene.add(pitch);

const ball=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16), new THREE.MeshStandardMaterial({color:0xfff})); ball.position.set(0,0.22,2); scene.add(ball);

let player, mixer, clock=new THREE.Clock(), actions={}, activeAction;
const loader=new GLTFLoader();
// Real human model from Three.js examples - works fast on mobile
loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf)=>{
  player=gltf.scene; player.scale.set(1.2,1.2,1.2); player.position.set(0,0,3); scene.add(player);
  mixer=new THREE.AnimationMixer(player);
  // Use Walk animation for dribbling
  actions.walk=mixer.clipAction(gltf.animations[1]); actions.run=mixer.clipAction(gltf.animations[2]); actions.idle=mixer.clipAction(gltf.animations[0]);
  activeAction=actions.idle; activeAction.play();
  document.getElementById('score').innerText='HUMAN LOADED - LIVE';
});

let sx=0,sy=0,isRun=false;
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{const r=joy.getBoundingClientRect();let x=e.touches[0].clientX-r.left-60,y=e.touches[0].clientY-r.top-60;let d=Math.hypot(x,y);if(d>40){x=x/d*40;y=y/d*40}stick.style.transform=`translate(${x}px,${y}px)`;sx=x/40;sy=y/40; if(player&&actions.walk){if(activeAction!==actions.walk){activeAction.fadeOut(0.2); activeAction=actions.walk; activeAction.fadeIn(0.2).play();}}},{passive:false});
joy.addEventListener('touchend',()=>{stick.style.transform='';sx=0;sy=0; if(player&&actions.idle){activeAction.fadeOut(0.2); activeAction=actions.idle; activeAction.fadeIn(0.2).play();}});
document.getElementById('run').addEventListener('touchstart',()=>{isRun=true; if(player&&actions.run){activeAction.fadeOut(0.1); activeAction=actions.run; activeAction.fadeIn(0.1).play();}});
document.getElementById('run').addEventListener('touchend',()=>{isRun=false;});
document.getElementById('shot').addEventListener('touchstart',()=>{ ball.position.z-= (isRun?5:3); ball.position.y=0.5; setTimeout(()=>ball.position.set(player.position.x,0.22,player.position.z+1), 800); });

function animate(){
 requestAnimationFrame(animate);
 const delta=clock.getDelta(); if(mixer) mixer.update(delta);
 if(player){ const sp=isRun?0.12:0.06; player.position.x+=sx*sp; player.position.z+=sy*sp; if(sx||sy) player.rotation.y=Math.atan2(sx,sy);
   camera.position.x+=(player.position.x-camera.position.x)*0.05; camera.position.z+=(player.position.z+6-camera.position.z)*0.05; camera.lookAt(player.position);
 }
 renderer.render(scene,camera);
}
animate();
</script></body></html>
