<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HOLO STRIKER FOOTBALL 2027</title>
<style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}html,body{width:100%;height:100%;overflow:hidden;background:#0a1a0a}canvas{display:block;width:100%!important;height:100%!important}#top{position:fixed;top:0;left:0;right:0;height:40px;background:#001a33;color:#0ff;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10;font-weight:900;border-bottom:2px solid #0ff;font-family:sans-serif;font-size:13px}#joy{position:fixed;left:15px;bottom:20px;width:115px;height:115px;border-radius:50%;border:3px solid #0ff;background:rgba(0,255,255,.12);z-index:10}#stick{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 0 15px #fff}#skill{position:fixed;right:15px;bottom:90px;width:85px;height:85px;border-radius:50%;border:3px solid #0ff;color:#0ff;display:grid;place-items:center;font-weight:900;background:rgba(0,255,255,.15);z-index:10;box-shadow:0 0 15px #0ff}#shot{position:fixed;left:150px;bottom:30px;width:70px;height:70px;border-radius:50%;border:3px solid #ff0;color:#ff0;display:grid;place-items:center;font-weight:900;background:rgba(255,255,0,.18);z-index:10;box-shadow:0 0 15px #ff0}#run{position:fixed;right:15px;bottom:15px;width:60px;height:60px;border-radius:50%;border:2px solid #0ff;color:#0ff;display:grid;place-items:center;font-size:12px;font-weight:900;z-index:10}</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="top"><span>HOLO STRIKER FOOTBALL 2027</span><span id="score">0 - 0</span><span>60FPS</span></div>
<div id="joy"><div id="stick"></div></div>
<div id="shot">SHOT</div><div id="skill">SKILL</div><div id="run">RUN</div>
<script type="module">
import * as THREE from 'three';

// CHECK
console.log("HOLO 2027 STARTING");

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a6a1a);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100); camera.position.set(0,9,12);
const renderer=new THREE.WebGLRenderer({antialias:false}); // FALSE = 60FPS for phone
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1); // FASTEST
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light=new THREE.DirectionalLight(0xffffff,0.8); light.position.set(5,10,5); scene.add(light);

// PITCH
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(40,70), new THREE.MeshStandardMaterial({color:0x2a8a2a}));
pitch.rotation.x=-Math.PI/2; scene.add(pitch);
const centerLine=new THREE.Mesh(new THREE.PlaneGeometry(0.1,40), new THREE.MeshStandardMaterial({color:0xffffff}));
centerLine.rotation.x=-Math.PI/2; centerLine.position.y=0.02; scene.add(centerLine);

// PLAYER - NO CAPSULE AGAIN, REAL BOX
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.8,0.4), new THREE.MeshStandardMaterial({color:0x00ff88})); body.position.y=1;
const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,10), new THREE.MeshStandardMaterial({color:0xe0c0a0})); head.position.y=1.8;
const leg=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.6,0.22), new THREE.MeshStandardMaterial({color:0x111111})); leg.position.set(0,0.3,0);
player.add(body,head,leg); player.position.set(0,0,6); scene.add(player);

// BALL
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12), new THREE.MeshStandardMaterial({color:0xffffff})); ball.position.set(0,0.25,7); scene.add(ball);

// GOAL
const g1=new THREE.Mesh(new THREE.BoxGeometry(0.1,2,0.1), new THREE.MeshStandardMaterial({color:0xffffff})); g1.position.set(-3,1,-20);
const g2=g1.clone(); g2.position.x=3; const g3=new THREE.Mesh(new THREE.BoxGeometry(6.1,0.1,0.1), new THREE.MeshStandardMaterial({color:0xffffff})); g3.position.set(0,2,-20);
scene.add(g1,g2,g3);

// CONTROLS - 100% WORKING
let sx=0,sy=0,run=false,walk=0, score=0, ballVel=new THREE.Vector3(), hasBall=true;
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
function move(e){ const r=joy.getBoundingClientRect(); let x=e.touches[0].clientX-r.left-57, y=e.touches[0].clientY-r.top-57; const d=Math.hypot(x,y); if(d>38){x=x/d*38;y=y/d*38} stick.style.transform=`translate(${x}px,${y}px)`; sx=x/38; sy=y/38; }
joy.addEventListener('touchmove',move,{passive:false}); joy.addEventListener('touchend',()=>{stick.style.transform=''; sx=0; sy=0;});
document.getElementById('run').addEventListener('touchstart',()=>run=true); document.getElementById('run').addEventListener('touchend',()=>run=false);
document.getElementById('shot').addEventListener('touchstart',()=>{
 if(player.position.distanceTo(ball.position)>2.5) return; hasBall=false; ballVel.set((Math.random()-0.5)*0.2,0.3,-0.8-(run?0.5:0));
});
document.getElementById('skill').addEventListener('touchstart',()=>{ player.rotation.y+=Math.PI; setTimeout(()=>player.rotation.y+=Math.PI,300); });

function animate(){
 requestAnimationFrame(animate);
 const sp=run?0.2:0.1;
 if(sx||sy){ player.position.x+=sx*sp; player.position.z+=sy*sp; player.rotation.y=Math.atan2(sx,sy); walk+=0.25;
   if(hasBall){ const tx=player.position.x+Math.sin(player.rotation.y)*0.8; const tz=player.position.z+Math.cos(player.rotation.y)*0.8; ball.position.x+=(tx-ball.position.x)*0.4; ball.position.z+=(tz-ball.position.z)*0.4; }
 }
 if(!hasBall){ ball.position.add(ballVel); ballVel.y-=0.03; ballVel.multiplyScalar(0.992); if(ball.position.y<0.25){ball.position.y=0.25; ballVel.y*=-0.4}
   if(ball.position.z<-20 && Math.abs(ball.position.x)<3){score++; document.getElementById('score').innerText=score+' - 0'; ball.position.set(player.position.x,0.25,player.position.z+1); ballVel.set(0,0,0); hasBall=true;}
   if(Math.abs(ball.position.x)>18 || Math.abs(ball.position.z)>30) {ball.position.set(player.position.x,0.25,player.position.z+1); ballVel.set(0,0,0); hasBall=true;}
 }
 camera.position.x+=(player.position.x-camera.position.x)*0.1; camera.position.z+=(player.position.z+10-camera.position.z)*0.1; camera.lookAt(player.position);
 renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
