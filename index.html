<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HOLO STRIKER FOOTBALL 2027</title>
<style>*{margin:0;padding:0;touch-action:none;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:sans-serif}#top{position:absolute;top:0;left:0;right:0;z-index:10;background:#001a33;color:#0ff;display:flex;justify-content:space-between;padding:10px 12px;font-weight:900;border-bottom:2px solid #0ff}#joy{position:absolute;left:15px;bottom:15px;width:130px;height:130px;border-radius:50%;border:3px solid #00ffff;background:radial-gradient(circle,rgba(0,255,255,0.25),rgba(0,0,0,0.2));box-shadow:0 0 25px #0ff;z-index:10}#stick{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 0 20px #fff}#skill{position:absolute;right:15px;bottom:85px;width:90px;height:90px;border-radius:50%;border:2px solid #0ff;color:#0ff;display:grid;place-items:center;font-weight:900;background:rgba(0,255,255,0.15);box-shadow:0 0 20px #0ff;z-index:10}#run{position:absolute;right:15px;bottom:15px;width:60px;height:60px;border-radius:50%;border:2px solid #0ff;color:#0ff;display:grid;place-items:center;font-size:11px;font-weight:900;background:rgba(0,255,255,0.1);z-index:10}#shot{position:absolute;left:160px;bottom:25px;width:75px;height:75px;border-radius:50%;border:2px solid #ff0;color:#ff0;display:grid;place-items:center;font-weight:900;background:rgba(255,255,0,0.15);z-index:10}#msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:10;color:#0ff;background:#000;padding:8px 15px;border:2px solid #0ff;border-radius:20px;font-weight:900;display:none}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="top"><span>HOLO STRIKER FOOTBALL 2027</span><span id="score">0 - 0</span></div>
<div id="msg">GOOOAL!</div>
<div id="joy"><div id="stick"></div></div>
<div id="shot">SHOT</div>
<div id="skill">SKILL</div>
<div id="run">RUN</div>
<script type="module">
import * as THREE from 'three';
let scoreA=0, scoreB=0;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1a0a);
const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,8,12);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));
const sun=new THREE.DirectionalLight(0xffffff,1); sun.position.set(10,15,10); sun.castShadow=true; scene.add(sun);

// PITCH
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(40,70), new THREE.MeshStandardMaterial({color:0x1a7a1a}));
pitch.rotation.x=-Math.PI/2; pitch.receiveShadow=true; scene.add(pitch);
const lineMat=new THREE.LineBasicMaterial({color:0xffffff});
function addLine(points){const g=new THREE.BufferGeometry().setFromPoints(points); const l=new THREE.Line(g,lineMat); l.position.y=0.02; scene.add(l);}
addLine([new THREE.Vector3(-15,-20,0),new THREE.Vector3(15,-20,0),new THREE.Vector3(15,20,0),new THREE.Vector3(-15,20,0),new THREE.Vector3(-15,-20,0)]);
addLine([new THREE.Vector3(0,-20,0),new THREE.Vector3(0,20,0)]);

// PLAYER with body parts - NOT CAPSULE
const player=new THREE.Group();
const torso=new THREE.Mesh(new THREE.BoxGeometry(0.8,1,0.5), new THREE.MeshStandardMaterial({color:0x00ff88})); torso.position.y=1.2; torso.castShadow=true;
const head=new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({color:0xe8c4a0})); head.position.y=2.1; head.castShadow=true;
const legL=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.8,0.25), new THREE.MeshStandardMaterial({color:0x000000})); legL.position.set(-0.2,0.4,0); legL.castShadow=true;
const legR=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.8,0.25), new THREE.MeshStandardMaterial({color:0x000000})); legR.position.set(0.2,0.4,0); legR.castShadow=true;
const armL=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2), new THREE.MeshStandardMaterial({color:0xe8c4a0})); armL.position.set(-0.55,1.2,0);
const armR=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2), new THREE.MeshStandardMaterial({color:0xe8c4a0})); armR.position.set(0.55,1.2,0);
player.add(torso,head,legL,legR,armL,armR); player.position.set(0,0,10); scene.add(player);

// BALL
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.28,20,20), new THREE.MeshStandardMaterial({color:0xffffff})); ball.position.set(0,0.28,11); ball.castShadow=true; scene.add(ball);

// GOAL
const goalG=new THREE.Group(); const mW=new THREE.MeshStandardMaterial({color:0xffffff});
const p1=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.2,0.12),mW); p1.position.set(-3.5,1.1,-25);
const p2=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.2,0.12),mW); p2.position.set(3.5,1.1,-25);
const cr=new THREE.Mesh(new THREE.BoxGeometry(7.12,0.12,0.12),mW); cr.position.set(0,2.2,-25);
goalG.add(p1,p2,cr); scene.add(goalG);

// CONTROLS - FIXED
let sx=0,sy=0,isRunning=false, walkCycle=0;
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{
 let r=joy.getBoundingClientRect(); let x=e.touches[0].clientX-r.left-65, y=e.touches[0].clientY-r.top-65;
 let d=Math.hypot(x,y); if(d>40){x=x/d*40; y=y/d*40} stick.style.transform=`translate(${x}px,${y}px)`; sx=x/35; sy=y/35;
},{passive:false});
joy.addEventListener('touchend',()=>{stick.style.transform=''; sx=0; sy=0;});
document.getElementById('run').addEventListener('touchstart',()=>isRunning=true);
document.getElementById('run').addEventListener('touchend',()=>isRunning=false);

document.getElementById('shot').addEventListener('touchstart',()=>{
 let power=isRunning?1.8:1;
 ball.position.y=0.5;
 let velZ=-1.2*power, velX=(Math.random()-0.5)*0.5;
 let g=0.05, vz=velZ, vx=velX, vy=0.4;
 let shot=setInterval(()=>{
   ball.position.z+=vz; ball.position.x+=vx; ball.position.y+=vy; vy-=g;
   if(ball.position.y<=0.28){ball.position.y=0.28; vy*=-0.3}
   if(ball.position.z<-25){
     clearInterval(shot);
     if(Math.abs(ball.position.x)<3.2 && ball.position.y<2.1){
       scoreA++; document.getElementById('score').innerText=scoreA+' - '+scoreB;
       let m=document.getElementById('msg'); m.innerText='GOOOAL! 2027!'; m.style.display='block'; setTimeout(()=>m.style.display='none',1500);
     }
     ball.position.set(player.position.x,0.28,player.position.z+1);
   }
   if(Math.abs(ball.position.x)>20 || Math.abs(ball.position.z)>35){clearInterval(shot); ball.position.set(player.position.x,0.28,player.position.z+1);}
 },16);
});

document.getElementById('skill').addEventListener('click',()=>{
 player.rotation.y+=Math.PI; ball.position.x+= (Math.random()-0.5)*2; ball.position.z+=0.5;
 let m=document.getElementById('msg'); m.innerText='SKILL MOVE!'; m.style.display='block'; setTimeout(()=>m.style.display='none',600);
});

function animate(){
 requestAnimationFrame(animate);
 let speed=isRunning?0.22:0.12;
 if(sx||sy){
   player.position.x+=sx*speed; player.position.z+=sy*speed;
   player.rotation.y=Math.atan2(sx,sy);
   walkCycle+=0.3; legL.rotation.x=Math.sin(walkCycle)*0.8; legR.rotation.x=-Math.sin(walkCycle)*0.8;
   armL.rotation.x=-Math.sin(walkCycle)*0.5; armR.rotation.x=Math.sin(walkCycle)*0.5;
   // DRIBBLE - ball sticks properly now
   let targetX=player.position.x+Math.sin(player.rotation.y)*0.8;
   let targetZ=player.position.z+Math.cos(player.rotation.y)*0.8;
   if(ball.position.distanceTo(player.position)<2){
     ball.position.x+=(targetX-ball.position.x)*0.3;
     ball.position.z+=(targetZ-ball.position.z)*0.3;
   }
 } else { legL.rotation.x=0; legR.rotation.x=0; }
 // Camera follow like eFootball
 camera.position.x+=(player.position.x-camera.position.x)*0.05;
 camera.position.z+=(player.position.z+10-camera.position.z)*0.05;
 camera.lookAt(player.position);
 renderer.render(scene,camera);
}
animate();
</script></body></html>
